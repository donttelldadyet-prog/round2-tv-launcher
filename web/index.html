<title>Round2 TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed 1920x1080 TV stage scaled to fit the screen. #world holds the moving
   background; #ui holds the menu (left), the side card (right) and the room card.
   Colours and type come from the round2.sg homepage. Motion uses transform/opacity only. */
:root {
  --void: #06050a;
  --ink: #f4f1fb;
  --mute: #b9b0cf;
  --dim: rgba(244, 241, 251, .62);
  --rule: rgba(244, 241, 251, .45);
  --panel: rgba(10, 8, 18, .9);
  --accent: #F2C21B;
  --room: #E8436A;
  --room-ink: #0b0914;
  --f-ui: 'Chakra Petch', 'Segoe UI', Roboto, sans-serif;
  --f-pix: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
*:focus, *:focus-visible { outline: none; }   /* the TV browser draws its own box otherwise; the menu shows focus itself */
* { -webkit-tap-highlight-color: transparent; }

#stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--void); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; }

/* ---------- background world ---------- */
#world { transition: transform .34s cubic-bezier(.55, 0, .85, .35); will-change: transform; }
.bg-glow { background:
    radial-gradient(38% 46% at 50% 52%, color-mix(in srgb, var(--room) 30%, transparent) 0%, transparent 70%),
    linear-gradient(180deg, #0d0a16 0%, #06050a 100%); }
.bg-media { width: 100%; height: 100%; object-fit: cover; }
#bgA, #bgB { transition: opacity .25s linear; }
#bgB { opacity: 0; }
.bg-shade { background: linear-gradient(90deg, rgba(6,5,10,.88) 0%, rgba(6,5,10,.45) 28%, rgba(6,5,10,0) 48%, rgba(6,5,10,0) 62%, rgba(6,5,10,.55) 100%);
  transition: opacity .25s linear; }
.scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px); }

/* ---------- interface ---------- */
#ui { transition: transform .26s cubic-bezier(.55, 0, .85, .35), opacity .2s linear; will-change: transform, opacity; }

header { position: absolute; top: 34px; left: 72px; right: 64px; display: flex; align-items: center; justify-content: space-between; }
.logo { height: 50px; }
.wordmark { font-weight: 400; font-size: 40px; letter-spacing: .14em; border: 2px solid var(--ink); border-top: 0; border-bottom: 0; padding: 0 12px; line-height: 1; }
.hud { display: flex; align-items: center; gap: 26px; font-family: var(--f-pix); font-size: 13px; letter-spacing: .14em; }
.avatar { display: block; width: 58px; height: 58px; border: 3px solid var(--room); background: #120f1c no-repeat 50% 4% / 260% auto;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
.badge { display: flex; align-items: center; gap: 12px; color: var(--mute); }
.badge b { font-weight: 400; padding: 8px 10px; background: var(--room); color: var(--room-ink); }
.clock { font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }

.panel { position: absolute; left: 72px; top: 196px; width: 640px; transition: opacity .16s linear, transform .2s var(--ease); }
.panel.off { opacity: 0; transform: translateX(-24px); pointer-events: none; }
.eyebrow { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--f-pix); font-size: 15px; letter-spacing: .22em; color: #cfc8de; }
.eyebrow .count { font-size: 11px; letter-spacing: .14em; color: var(--mute); }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 30px; }
.divider span { width: 150px; height: 1px; background: var(--rule); }
.divider i { width: 12px; height: 12px; border: 2px solid var(--ink); transform: rotate(45deg); }
.list { display: flex; flex-direction: column; gap: 8px; }
.mi { display: flex; align-items: center; gap: 18px; width: 540px; height: 68px; padding: 0 24px; border: 0; background: transparent;
  color: var(--dim); text-align: left; font: inherit; cursor: pointer;
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); transition: background .08s, color .08s; }
.mi svg { flex: none; opacity: 0; }
.mi .label { flex: 1; font-size: 34px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi .hint { font-family: var(--f-pix); font-size: 10px; letter-spacing: .1em; opacity: .45; white-space: nowrap; }
.mi.on { background: var(--room); color: var(--room-ink); }
.mi.on svg { opacity: 1; }
.mi.on .hint { opacity: .9; }

/* background picker rows, after CleanFrame's wallpaper list */
.wallview { position: relative; height: 552px; overflow: hidden; }
.wallrows { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 8px; transition: transform .16s var(--ease); will-change: transform; }
.mi.wall { width: 640px; height: 84px; padding: 0 20px 0 12px; }
.thumb { flex: none; width: 104px; height: 58px; overflow: hidden; background: #1a1626; }
.thumb img, .thumb video { display: block; width: 100%; height: 100%; object-fit: cover; }
.mi.wall .label { font-size: 30px; }
.picked { font-family: var(--f-pix); font-size: 10px; letter-spacing: .1em; }

.side { transition: opacity .2s linear; }
.picking .side { opacity: 0; }
.picking .bg-shade { opacity: .55; }
.roomcard { position: absolute; right: 64px; bottom: 100px; width: 330px; padding: 18px 20px 20px; background: var(--panel);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.roomcard .top { display: flex; justify-content: space-between; font-family: var(--f-pix); font-size: 10px; letter-spacing: .14em; color: var(--accent); }
.roomcard .name { margin: 12px 0 6px; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: .06em; text-transform: uppercase; color: var(--room); }
.roomcard .spec { font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #d6d0e3; }

section.peek { position: absolute; right: 64px; top: 180px; width: 600px; padding: 42px; background: var(--panel); border: 1px solid rgba(244,241,251,.16); }
.peek .tag { font-family: var(--f-pix); font-size: 12px; letter-spacing: .16em; color: var(--room); }
.peek h1 { margin: 20px 0 16px; font-size: 76px; line-height: .95; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.peek p { margin: 0; font-size: 24px; line-height: 1.45; color: #d6d0e3; max-width: 30ch; }
.peek dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; margin: 28px 0 0; font-size: 20px; }
.peek dt { font-family: var(--f-pix); font-size: 11px; letter-spacing: .14em; color: var(--mute); align-self: center; }
.peek dd { margin: 0; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.peek .go { display: flex; align-items: center; gap: 12px; margin-top: 34px; padding-top: 22px; border-top: 1px solid rgba(244,241,251,.16);
  font-family: var(--f-pix); font-size: 13px; letter-spacing: .14em; color: var(--accent); }
.peek .go .bar { flex: 1; height: 10px; opacity: .5; background: repeating-linear-gradient(90deg, var(--accent) 0 12px, transparent 12px 18px); }
.swap { animation: swap .2s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

footer { position: absolute; left: 72px; right: 64px; bottom: 36px; display: flex; justify-content: space-between;
  font-family: var(--f-pix); font-size: 12px; letter-spacing: .12em; color: var(--mute); }
footer .keys { display: flex; gap: 30px; }

/* ---------- "low card" layout for scenes whose logo fills the upper right / centre ---------- */
.card-low .roomcard { display: none; }
.card-low section.peek { top: auto; bottom: 92px; width: 560px; padding: 30px 34px; }
.card-low .peek h1 { margin: 14px 0 10px; font-size: 54px; }
.card-low .peek p { font-size: 20px; }
.card-low .peek dl { margin-top: 16px; font-size: 18px; }
.card-low .peek .go { margin-top: 18px; padding-top: 14px; }
.card-low #items .mi { width: 460px; }
.card-low .bg-shade { background:
    linear-gradient(90deg, rgba(6,5,10,.86) 0%, rgba(6,5,10,.38) 24%, rgba(6,5,10,0) 38%),
    linear-gradient(0deg, rgba(6,5,10,.7) 0%, rgba(6,5,10,0) 34%); }

/* ---------- app / input grid ---------- */
#apps { position: absolute; inset: 0; background: rgba(4,3,8,.95); padding: 120px 140px; overflow: hidden; }
.gridview { position: absolute; left: 140px; right: 140px; top: 200px; bottom: 90px; overflow: hidden; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; transition: transform .16s var(--ease); will-change: transform; }
.more { position: absolute; left: 140px; right: 140px; bottom: 40px; text-align: center; font-family: var(--f-pix); font-size: 12px; letter-spacing: .14em; color: var(--mute); }
.tile { position: relative; height: 170px; padding: 22px; border: 2px solid rgba(244,241,251,.14); background: rgba(16,13,26,.9);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%); }
.tile .mono { font-family: var(--f-pix); font-size: 26px; color: var(--room); }
.tile .nm { font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tile .sub { position: absolute; right: 22px; top: 24px; font-family: var(--f-pix); font-size: 11px; letter-spacing: .12em; opacity: .7; }
.tile.on { background: var(--room); color: var(--room-ink); border-color: var(--room); }
.tile.on .mono { color: var(--room-ink); }

/* ---------- transitions (Options > Transition: Warp / Dive / Off) ---------- */
#flash, #warp, #veil, #dim, #ship { pointer-events: none; }
/* lightning: a violet-white flash like the strikes in the scene loops */
#flash { opacity: 0; background: radial-gradient(70% 90% at var(--fx, 50%) var(--fy, 40%), #fff 0%, #d9c8ff 30%, rgba(160,120,255,.5) 60%, rgba(60,40,140,0) 100%); }
@keyframes strike { 0% { opacity: 0 } 10% { opacity: .75 } 22% { opacity: .15 } 34% { opacity: .55 } 100% { opacity: 0 } }
#dim { opacity: 0; background: #06050a; }

/* Warp: light streams out of the logo as the camera jumps toward it, ending in a teal bloom */
#warp { opacity: 0; overflow: hidden; }
#warp .rays { position: absolute; left: var(--fx, 50%); top: var(--fy, 50%); width: 3400px; height: 3400px; margin: -1700px 0 0 -1700px;
  background: repeating-conic-gradient(from 0deg, rgba(0,0,0,0) 0deg 3.6deg, rgba(200,255,245,.9) 3.6deg 3.85deg, rgba(0,0,0,0) 3.85deg 6.1deg, rgba(140,200,255,.6) 6.1deg 6.25deg);
  -webkit-mask-image: radial-gradient(circle, transparent 0, transparent 5%, #000 16%, #000 58%, transparent 70%);
  mask-image: radial-gradient(circle, transparent 0, transparent 5%, #000 16%, #000 58%, transparent 70%);
  transform: scale(.12); will-change: transform; }
#veil { opacity: 0; background: radial-gradient(55% 65% at var(--fx, 50%) var(--fy, 50%), #effffc 0%, var(--room) 28%, #06050a 72%); }
.go-warp #world { transform: scale(1.55); transition: transform .4s cubic-bezier(.6, 0, .9, .5); }
.go-warp #ui { opacity: 0; transform: scale(1.06); transition: opacity .12s linear, transform .2s ease-in; }
.go-warp #warp { animation: on .4s linear both; }
.go-warp #warp .rays { animation: rays .42s cubic-bezier(.45, 0, .9, .4) both; }
.go-warp #veil { animation: veil .42s ease-in both; }
@keyframes on { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 1 } }
@keyframes rays { from { transform: scale(.12) rotate(0deg) } to { transform: scale(1.5) rotate(10deg) } }
@keyframes veil { 0% { opacity: 0 } 50% { opacity: 0 } 80% { opacity: .9 } 100% { opacity: 1 } }

/* Dive: a calm push into the logo and a fade */
.go-dive #world { transform: scale(1.35); transition: transform .34s cubic-bezier(.5, 0, .8, .4); }
.go-dive #ui { opacity: 0; transition: opacity .16s linear; }
.go-dive #dim { opacity: 1; transition: opacity .18s linear .14s; }

/* coming back without the Home animation: a quick settle */
.settle #world { animation: settle .32s var(--ease) both; }
.settle #ui { animation: fadeUp .22s linear both; }
@keyframes settle { from { transform: scale(1.08) } to { transform: none } }
@keyframes fadeUp { from { opacity: 0 } to { opacity: 1 } }

/* Home animation: lightning, a ship skims past the camera, the menu powers on */
#ship { position: absolute; left: 0; top: 0; width: 1100px; height: 300px; opacity: 0; will-change: transform; }
.entering #dim { animation: entryDim .5s ease-out both; }
.entering #world { animation: entryWorld 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.entering #flash { animation: strike .32s linear .1s both; }
.entering #ship { animation: flyby .95s cubic-bezier(.35, .05, .55, 1) .2s both; }
.entering header, .entering footer { animation: rise .4s var(--ease) .5s both; }
.entering #items .mi { animation: slideIn .34s var(--ease) both; }
.entering #items .mi:nth-child(1) { animation-delay: .52s } .entering #items .mi:nth-child(2) { animation-delay: .56s }
.entering #items .mi:nth-child(3) { animation-delay: .6s }  .entering #items .mi:nth-child(4) { animation-delay: .64s }
.entering #items .mi:nth-child(5) { animation-delay: .68s } .entering #items .mi:nth-child(6) { animation-delay: .72s }
.entering #items .mi:nth-child(7) { animation-delay: .76s } .entering #items .mi:nth-child(8) { animation-delay: .8s }
.entering #items .mi:nth-child(9) { animation-delay: .84s } .entering #items .mi:nth-child(10) { animation-delay: .88s }
.entering .side { animation: rise .4s var(--ease) .74s both; }
.entering .panel .eyebrow, .entering .panel .divider { animation: rise .34s var(--ease) .46s both; }
@keyframes entryDim { from { opacity: 1 } to { opacity: 0 } }
@keyframes entryWorld { from { transform: scale(1.14) } to { transform: none } }
@keyframes flyby { 0% { opacity: 1; transform: translate(2150px, 560px) scale(.5) rotate(-3deg) } 100% { opacity: 1; transform: translate(-1550px, -140px) scale(1.6) rotate(-9deg) } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-44px) } to { opacity: 1; transform: none } }
@keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
.snap * { transition: none !important; }

#toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); padding: 18px 28px; background: var(--ink); color: var(--room-ink);
  font-size: 22px; font-weight: 600; letter-spacing: .04em; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }

#preview { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: #0d0a16; border-top: 1px solid rgba(244,241,251,.12); font: 13px/1.3 var(--f-ui); color: var(--mute); }
#preview .k { font-family: var(--f-pix); font-size: 9px; letter-spacing: .12em; color: var(--accent); }
#preview button { font: 600 13px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid rgba(244,241,251,.25); padding: 6px 10px; cursor: pointer; }
#preview button[aria-pressed="true"] { background: var(--room); color: var(--room-ink); border-color: var(--room); }
#preview .tip { margin-left: auto; }

@media (prefers-reduced-motion: reduce) {
  #world, #ui, .panel, .wallrows, .grid, .mi, #bgA, #bgB { transition: none !important; }
  .swap, #warp, #warp .rays, #veil, #flash, #ship, .entering *, .settle * { animation: none !important; }
}
</style>

<div id="stage" role="application" aria-label="Round2 TV home screen">
  <div id="world" class="layer">
    <div class="layer bg-glow"></div>
    <div class="layer" id="bgA"></div>
    <div class="layer" id="bgB"></div>
    <div class="layer bg-shade"></div>
    <div class="layer scan" aria-hidden="true"></div>
  </div>

  <div id="ui" class="layer">
    <header>
      <div id="brand"><span class="wordmark">ROUND2</span></div>
      <div class="hud">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="badge">P1 <b id="roomBadge">VALE</b> <span id="tierBadge">NETFLIX ROOM</span></span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <nav class="panel" id="menuPanel" aria-label="Main menu">
      <div class="eyebrow">MAIN MENU</div>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <div class="list" id="items"></div>
    </nav>

    <nav class="panel off" id="setPanel" aria-label="Options">
      <div class="eyebrow"><span id="setTitle">OPTIONS</span><span class="count" id="setCount"></span></div>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <div class="list" id="setList"></div>
      <div class="wallview" id="wallView" hidden><div class="wallrows" id="wallRows"></div></div>
    </nav>

    <div class="side">
      <div class="roomcard" aria-label="This room">
        <div class="top"><span>&#9733; THIS ROOM</span><span id="paxBadge">1–3 PAX</span></div>
        <div class="name" id="roomName">Vale</div>
        <div class="spec" id="roomSpec">65" TV · PS4</div>
      </div>
      <section class="peek" aria-live="polite" id="peek"></section>
    </div>

    <footer>
      <div class="keys" id="keys"><span>[OK] SELECT</span><span>[&#9650;&#9660;] MOVE</span><span>[HOME] BACK TO THIS MENU</span></div>
      <div>20 HAJI LANE · SINGAPORE</div>
    </footer>

    <div id="apps" hidden>
      <div class="eyebrow" id="gridTitle">MORE APPS · [BACK] TO RETURN</div>
      <div class="gridview"><div class="grid" id="grid"></div></div>
      <div class="more" id="gridMore" hidden>&#9660; MORE BELOW</div>
    </div>
  </div>

  <div id="dim" class="layer" aria-hidden="true"></div>
  <div id="flash" class="layer" aria-hidden="true"></div>

  <div id="veil" class="layer" aria-hidden="true"></div>
  <svg id="ship" viewBox="0 0 1100 300" aria-hidden="true">

      <linearGradient id="shTrail" x1="0" x2="1"><stop offset="0" stop-color="#e8fffb" stop-opacity=".95"/><stop offset=".18" style="stop-color: var(--room)" stop-opacity=".85"/><stop offset="1" style="stop-color: var(--room)" stop-opacity="0"/></linearGradient>
      <linearGradient id="shHull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3358"/><stop offset=".45" stop-color="#15111f"/><stop offset="1" stop-color="#06050a"/></linearGradient>
      <radialGradient id="shEng"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#b8fff3"/><stop offset="1" style="stop-color: var(--room)" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="600" y="122" width="500" height="26" fill="url(#shTrail)"/>
    <rect x="600" y="160" width="430" height="14" fill="url(#shTrail)" opacity=".7"/>
    <path d="M330 176 L520 252 L612 252 L566 182 Z" fill="#0d0b16" stroke="#b8fff3" stroke-opacity=".35" stroke-width="2"/>
    <path d="M436 102 L538 46 L594 48 L562 106 Z" fill="#1a1528" stroke="#b8fff3" stroke-opacity=".35" stroke-width="2"/>
    <path d="M18 150 L300 116 L470 94 L604 102 L648 126 L648 180 L604 192 L420 194 L300 180 Z" fill="url(#shHull)" stroke="#b8fff3" stroke-opacity=".55" stroke-width="2"/>
    <path d="M150 136 L300 121 L334 133 L172 147 Z" fill="#9ffaea" opacity=".85"/>
    <path d="M70 154 L590 142" style="stroke: var(--room)" stroke-width="4" opacity=".9"/>
    <circle cx="648" cy="136" r="30" fill="url(#shEng)"/>
    <circle cx="648" cy="170" r="20" fill="url(#shEng)"/>
    <circle cx="560" cy="250" r="5" fill="#ff3b5c"/><circle cx="560" cy="50" r="4" fill="#ffffff"/>
  </svg>
  <div id="toast" role="status" hidden></div>
</div>

<div id="preview" hidden>
  <span class="k">PREVIEW ROOM</span>
  <span id="roomBtns"></span>
  <span class="tip">Use the arrow keys and Enter, like the TV remote</span>
</div>

<script>
/* ================= ROUND2 TV SETTINGS (one block per TV) ================= */
window.R2_TV = {
  room: '',              // leave empty: the TV asks on first start. Or set vale | kaeden | scarlett | bella | kai | atlas | maximillion
  inputNames: {          // names shown in the Inputs menu; unnamed ports show as "Guest device"
    'HDMI 1': 'PlayStation'
  }
};
/* ========================================================================= */

(function () {
  'use strict';

  var WIX = 'https://static.wixstatic.com/media/';
  var ASSETS = {
    logo: WIX + 'a46627_0c92a12b5ec442aeaaa57c744095d829~mv2.webp',
    char: {
      vale: 'a46627_a583d7ac9f5e425c8770261a9f4a5dde~mv2.webp', kaeden: 'a46627_047b973fc70140b9935452a5eee426db~mv2.webp',
      scarlett: 'a46627_feafbe9bf95d4bffbea8855d66d0a63c~mv2.webp', bella: 'a46627_a61b016ed61045f28c2dba9b6146e9d4~mv2.webp',
      kai: 'a46627_2c836d63bbdd4332a4a67233df2fb631~mv2.webp', atlas: 'a46627_633e94e1767940b7a6297c4e597d25c3~mv2.webp',
      maximillion: 'a46627_fb0c6ed29fdb4c74b8a4ce1a5c99050c~mv2.webp'

    else if (k === 'ok') {
      clearTimeout(wallPreviewTimer);
      store('r2.wall.' + roomKey, walls[wsel].id);
      showWall(walls[wsel]);
      Sfx.play('ok');
      openSettings(0);
      toast('Background: ' + walls[wsel].name);
    } else if (k === 'back' || k === 'left') {
      clearTimeout(wallPreviewTimer);
      showWall(currentWall());
      Sfx.play('back');
      openSettings(0);
    }
  }

  /* Two background slots cross-fade, so changing background never flashes black */
  var front = 'bgA', shownWall = null;
  function showWall(w) {
    if (!w || (shownWall && shownWall.id === w.id && shownWall.room === roomKey)) return;
    shownWall = { id: w.id, room: roomKey };
    if (w.layout === 'low') addCls('card-low'); else dropCls('card-low');
    $('world').style.transformOrigin = w.focus || '50% 50%';
    var fp = (w.focus || '50% 40%').split(' ');
    $('stage').style.setProperty('--fx', fp[0]); $('stage').style.setProperty('--fy', fp[1]);
    var back = front === 'bgA' ? 'bgB' : 'bgA', slot = $(back), old = $(front);
    if (!w.video && !w.image) { $(front).style.opacity = '0'; return; }
    var el;
    if (w.video) {
      el = document.createElement('video');
      el.muted = true; el.loop = true; el.autoplay = true; el.setAttribute('playsinline', ''); el.setAttribute('muted', '');
      if (w.thumb) el.poster = w.thumb;
    } else {
      el = document.createElement('img'); el.alt = '';
    }
    el.className = 'bg-media';
    var swapped = false;
    function swap() {
      if (swapped) return; swapped = true;
      slot.style.opacity = '1'; old.style.opacity = '0';
      front = back;
      setTimeout(function () { if (front !== old.id) { var m = old.firstChild; if (m && m.pause) m.pause(); old.innerHTML = ''; } }, 300);
    }
    if (w.video) { el.addEventListener('loadeddata', swap); el.src = w.video; try { el.play(); } catch (e) {} setTimeout(swap, 900); }
    else { el.onload = swap; el.src = w.image; }
    slot.innerHTML = ''; slot.appendChild(el);
  }

  function keys(a, b, c) { $('keys').innerHTML = '<span>' + a + '</span><span>' + b + '</span><span>' + c + '</span>'; }

  /* ================= app / input grids ================= */
  function renderGrid(moveOnly) {
    var tiles = $('grid').children;
    if (moveOnly && tiles.length === gridItems.length) {
      for (var t = 0; t < tiles.length; t++) tiles[t].className = 'tile' + (t === gsel ? ' on' : '');
      scrollGrid(); return;
    }
    var html = '';
    for (var i = 0; i < gridItems.length; i++) {
      var a = gridItems[i];
      html += '<button type="button" tabindex="-1" class="tile' + (i === gsel ? ' on' : '') + '" data-g="' + i + '"><span class="mono">' +
        esc(a.mono || a.name.charAt(0)) + '</span><span class="nm">' + esc(a.name) + '</span>' +
        (a.sub ? '<span class="sub">' + esc(a.sub) + '</span>' : '') + '</button>';
    }
    $('grid').innerHTML = html;
    scrollGrid();
  }
  function scrollGrid() {
    var cols = 5, rowH = 194, rows = 4, row = Math.floor(gsel / cols), total = Math.ceil(gridItems.length / cols);
    if (row < gridTop) gridTop = row;
    if (row >= gridTop + rows) gridTop = row - rows + 1;
    $('grid').style.transform = 'translateY(' + (-gridTop * rowH) + 'px)';
    $('gridMore').hidden = gridTop + rows >= total;
  }
  function inputTiles() {
    var list = Device.inputs(), out = [];
    for (var i = 0; i < list.length; i++) {
      var port = list[i].name, named = cfg.inputNames[port];
      out.push({ input: list[i].id, port: port, mono: port.replace(/[^0-9]/g, '') || port.charAt(0),
        name: named ? (named === 'PlayStation' ? room.ps : named) : 'Guest device', sub: port });
    }
    return out;
  }
  function roomTiles() {
    var out = [];
    for (var k in ROOMS) if (ROOMS.hasOwnProperty(k)) out.push({ roomPick: k, name: ROOMS[k].name, sub: TIERS[ROOMS[k].t].split(' ')[0].toUpperCase() });
    return out;
  }
  function openGrid(kind) {
    gridItems = kind === 'inputs' ? inputTiles() : kind === 'rooms' ? roomTiles() : Device.apps();
    $('gridTitle').textContent = kind === 'rooms' ? 'SET UP THIS TV · WHICH ROOM IS IT IN?' : (kind === 'inputs' ? 'INPUTS' : 'MORE APPS') + ' · [BACK] TO RETURN';
    gsel = 0; gridTop = 0; mode = 'grid'; $('apps').hidden = false; renderGrid();
  }
  function closeGrid() { if (mode === 'grid') mode = 'menu'; $('apps').hidden = true; }
  function gridKey(k) {
    var cols = 5, n = gridItems.length;
    if (k === 'left') gsel = Math.max(0, gsel - 1);
    else if (k === 'right') gsel = Math.min(n - 1, gsel + 1);
    else if (k === 'up') gsel = gsel - cols >= 0 ? gsel - cols : gsel;
    else if (k === 'down') gsel = Math.min(n - 1, gsel + cols);
    else if (k === 'ok') { launch(gridItems[gsel]); return; }
    else if (k === 'back') { closeGrid(); return; }
    renderGrid(true);
  }

  /* ================= opening things ================= */
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* Leaving: the chosen transition plays, the app opens under its last frames */
  var leaving = false, entryTimer;
  function clearAnim() {
    clearTimeout(entryTimer);
    dropCls('go-warp'); dropCls('go-dive'); dropCls('entering'); dropCls('settle');
  }
  function dive(then) {
    leaving = true;
    clearAnim();
    if (prefs.fx === 'off') { then(); return; }
    addCls(prefs.fx === 'dive' ? 'go-dive' : 'go-warp');
    setTimeout(then, prefs.fx === 'dive' ? 260 : 300);
  }
  /* Returning (Home pressed, or an app closed): the Home animation, or a quick settle */
  function arrive(force) {
    var st = $('stage');
    leaving = false;
    addCls('snap'); clearAnim(); void st.offsetWidth; dropCls('snap');
    if (prefs.entry || force) {
      addCls('entering');
      entryTimer = setTimeout(function () { dropCls('entering'); }, 1700);
    } else {
      addCls('settle');
      entryTimer = setTimeout(function () { dropCls('settle'); }, 400);
    }
  }
  function surface() { if (leaving) arrive(false); }
  function demoTransition() {
    dive(function () { setTimeout(function () { arrive(false); }, 250); });
  }

  function launch(it) {
    if (it.roomPick) { store('r2.room', it.roomPick); applyRoom(it.roomPick); closeGrid(); toast('This TV is now set to ' + room.name + '.'); return; }
    if (it.key === 'continue') { if (it.last) return launch(it.last); toast('Pick something from the menu to start.'); return; }
    if (it.key === 'more') { openGrid('apps'); return; }
    if (it.key === 'inputs') { openGrid('inputs'); return; }
    if (it.key === 'options') { openSettings(0); return; }
    if (Device.kind() === 'preview') { dive(function () { doOpen(it); setTimeout(function () { arrive(false); }, 500); }); return; }
    dive(function () { doOpen(it); });
  }
  function doOpen(it) {
    Device.open(it, function (err) {
      if (err === 'preview') toast('On the TV, this opens ' + (it.input ? it.port : it.label || it.name) + '.');
      else if (err) { arrive(false); toast(err); return; }
      if (!it.input && !it.settings) {
        store('r2.last', JSON.stringify({ key: it.key || 'app', name: it.label || it.name, android: it.android, tizen: it.tizen, webos: it.webos }));
        var keep = sel; buildItems(); sel = Math.min(keep, items.length - 1); renderMenu();
      }
    });
  }

  /* ================= remote ================= */
  var KEYS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down', 13: 'ok', 23: 'ok', 27: 'back', 8: 'back', 10009: 'back', 461: 'back' };
  function press(k) {
    if (leaving) return;
    Sfx.wake();
    if (/entering|settle/.test($('stage').className)) { addCls('snap'); clearAnim(); void $('stage').offsetWidth; dropCls('snap'); }   /* a key press skips the intro */
    if (mode === 'menu') {
      if (k === 'up') { select((sel + items.length - 1) % items.length); Sfx.play('move'); }
      else if (k === 'down') { select((sel + 1) % items.length); Sfx.play('move'); }
      else if (k === 'ok') { Sfx.play('ok'); launch(items[sel]); }
    } else if (mode === 'grid') {
      if (k === 'ok') Sfx.play('ok'); else if (k === 'back') Sfx.play('back'); else Sfx.play('move');
      gridKey(k);
    }
    else if (mode === 'settings') settingsKey(k);
    else if (mode === 'walls') wallsKey(k);
  }
  document.addEventListener('keydown', function (ev) {
    var k = KEYS[ev.keyCode]; if (!k) return;
    ev.preventDefault(); press(k);
  });
  /* the Android app calls these: Back on the remote, a room set from the computer, and returning here */
  window.r2Back = function () { press('back'); };
  window.r2SetRoom = function (k) { if (ROOMS[k]) { store('r2.room', k); applyRoom(k); closeGrid(); } };
  window.r2Resume = function () {
    arrive(false);
    if (mode === 'grid') closeGrid();
    var keep = sel; buildItems(); sel = Math.min(keep, items.length - 1);
    if (mode === 'menu') renderMenu();
    var v = $(front).firstChild; if (v && v.play) { try { v.play(); } catch (e) {} }
  };

  /* pointer support for the browser preview */
  $('items').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.mi') : null; if (!b) return;
    select(+b.getAttribute('data-i')); launch(items[sel]);
  });
  $('setList').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.mi') : null; if (!b) return;
    $('setList').children[setSel].className = 'mi'; setSel = +b.getAttribute('data-s'); settingsKey('ok');
  });
  $('wallRows').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.mi') : null; if (!b) return;
    var i = +b.getAttribute('data-w');
    if (i === wsel) wallsKey('ok'); else moveWall(i, true);
  });
  $('grid').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.tile') : null; if (!b) return;
    gsel = +b.getAttribute('data-g'); renderGrid(true); launch(gridItems[gsel]);
  });
  $('apps').addEventListener('click', function (ev) { if (ev.target === $('apps')) closeGrid(); });

  /* ================= room ================= */
  function applyRoom(key) {
    roomKey = key; room = ROOMS[key];
    var r = document.documentElement.style;
    r.setProperty('--room', room.color); r.setProperty('--room-ink', room.ink);
    $('roomBadge').textContent = room.name.toUpperCase();
    $('tierBadge').textContent = TIERS[room.t].toUpperCase();
    $('roomName').textContent = room.name;
    $('roomSpec').textContent = room.screen + ' · ' + room.ps;
    $('paxBadge').textContent = room.pax.toUpperCase();
    $('avatar').style.backgroundImage = 'url("' + WIX + ASSETS.char[key] + '")';
    sel = 0; buildItems(); renderMenu();
    showWall(currentWall());
    var btns = document.querySelectorAll('#roomBtns button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-r') === key);
  }

  function tick() {
    var s;
    try { s = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { var d = new Date(); s = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    $('clock').textContent = s;
  }

  var PREVIEW_BAR = 0;
  function fit() {
    var de = document.documentElement;
    var w = de.clientWidth || window.innerWidth || 0;
    var h = (de.clientHeight || window.innerHeight || 0) - PREVIEW_BAR;
    if (w <= 0 || h <= 0) { setTimeout(fit, 100); return; }
    var s = Math.min(w / 1920, h / 1080), st = $('stage').style;
    st.left = Math.round((w - 1920 * s) / 2) + 'px';
    st.top = Math.round((h - 1080 * s) / 2) + 'px';
    st.transform = 'scale(' + s + ')';
  }

  /* Logo from Wix (loads on the TV; a blocked load keeps the text fallback) */
  var logo = new Image();
  logo.onload = function () { logo.className = 'logo'; logo.alt = 'Round2'; $('brand').innerHTML = ''; $('brand').appendChild(logo); };
  logo.src = ASSETS.logo;

  /* skip bundled scenes that aren't in this build */
  (function () {
    var all = { _common: COMMON };
    for (var sk in SCENES) if (SCENES.hasOwnProperty(sk)) all[sk] = SCENES[sk];
    for (var rk in all) if (all.hasOwnProperty(rk)) for (var i = 0; i < all[rk].length; i++) (function (sc, rkey) {
      var probe = new Image();
      probe.onerror = function () {
        missing[sc.id] = true;
        if (shownWall && shownWall.id === sc.id) { shownWall = null; showWall(currentWall()); }
      };
      probe.src = sc.thumb;
    }(all[rk][i], rk));
  }());

  if (Device.kind() === 'preview') {
    var html = '';
    for (var k in ROOMS) if (ROOMS.hasOwnProperty(k)) html += '<button type="button" data-r="' + k + '">' + ROOMS[k].name + '</button> ';
    $('roomBtns').innerHTML = html;
    $('roomBtns').addEventListener('click', function (ev) {
      var r = ev.target.getAttribute && ev.target.getAttribute('data-r');
      if (r) { closeGrid(); if (mode !== 'menu') closeSettings(); applyRoom(r); ev.target.blur(); }
    });
    $('preview').hidden = false;
    PREVIEW_BAR = $('preview').offsetHeight;
  }

  window.addEventListener('resize', function () { if (!$('preview').hidden) PREVIEW_BAR = $('preview').offsetHeight; fit(); });
  window.addEventListener('load', fit);
  applyRoom(roomKey);
  fit(); tick(); setInterval(tick, 15000);
  setTimeout(fit, 400); setTimeout(fit, 1500);
  arrive(false);                         /* the Home animation also plays when the TV starts */
  if (needsRoom && Device.kind() !== 'preview') openGrid('rooms');
}());
</script>
