<title>Round2 TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed 1920x1080 TV stage scaled to fit the screen. #world holds the moving
   background; #ui holds the menu (left), the side card (right) and the room card.
   Colours and type come from the round2.sg homepage. Motion uses transform/opacity only. */
:root {
  --void: #06050a;
  --ink: #f4f1fb;
  --mute: #b9b0cf;
  --dim: rgba(244, 241, 251, .62);
  --rule: rgba(244, 241, 251, .45);
  --panel: rgba(10, 8, 18, .9);
  --accent: #F2C21B;
  --room: #E8436A;
  --room-ink: #0b0914;
  --f-ui: 'Chakra Petch', 'Segoe UI', Roboto, sans-serif;
  --f-pix: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
*:focus, *:focus-visible { outline: none; }   /* the TV browser draws its own box otherwise; the menu shows focus itself */
* { -webkit-tap-highlight-color: transparent; }

#stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--void); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; }

/* ---------- background world ---------- */
#world { transition: transform .34s cubic-bezier(.55, 0, .85, .35); will-change: transform; }
.bg-glow { background:
    radial-gradient(38% 46% at 50% 52%, color-mix(in srgb, var(--room) 30%, transparent) 0%, transparent 70%),
    linear-gradient(180deg, #0d0a16 0%, #06050a 100%); }
.bg-media { width: 100%; height: 100%; object-fit: cover; }
#bgA, #bgB { transition: opacity .25s linear; }
#bgB { opacity: 0; }
.bg-shade { background: linear-gradient(90deg, rgba(6,5,10,.88) 0%, rgba(6,5,10,.45) 28%, rgba(6,5,10,0) 48%, rgba(6,5,10,0) 62%, rgba(6,5,10,.55) 100%);
  transition: opacity .25s linear; }
.scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px); }

/* ---------- interface ---------- */
#ui { transition: transform .26s cubic-bezier(.55, 0, .85, .35), opacity .2s linear; will-change: transform, opacity; }

header { position: absolute; top: 34px; left: 72px; right: 64px; display: flex; align-items: center; justify-content: space-between; }
.logo { height: 50px; }
.wordmark { font-weight: 400; font-size: 40px; letter-spacing: .14em; border: 2px solid var(--ink); border-top: 0; border-bottom: 0; padding: 0 12px; line-height: 1; }
.hud { display: flex; align-items: center; gap: 26px; font-family: var(--f-pix); font-size: 13px; letter-spacing: .14em; }
.avatar { display: block; width: 58px; height: 58px; border: 3px solid var(--room); background: #120f1c no-repeat 50% 4% / 260% auto;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
.badge { display: flex; align-items: center; gap: 12px; color: var(--mute); }
.badge b { font-weight: 400; padding: 8px 10px; background: var(--room); color: var(--room-ink); }
.clock { font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }

.panel { position: absolute; left: 72px; top: 196px; width: 640px; transition: opacity .16s linear, transform .2s var(--ease); }
.panel.off { opacity: 0; transform: translateX(-24px); pointer-events: none; }
.eyebrow { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--f-pix); font-size: 15px; letter-spacing: .22em; color: #cfc8de; }
.eyebrow .count { font-size: 11px; letter-spacing: .14em; color: var(--mute); }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 30px; }
.divider span { width: 150px; height: 1px; background: var(--rule); }
.divider i { width: 12px; height: 12px; border: 2px solid var(--ink); transform: rotate(45deg); }
.list { display: flex; flex-direction: column; gap: 8px; }
.mi { display: flex; align-items: center; gap: 18px; width: 540px; height: 68px; padding: 0 24px; border: 0; background: transparent;
  color: var(--dim); text-align: left; font: inherit; cursor: pointer;
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); transition: background .08s, color .08s; }
.mi svg { flex: none; opacity: 0; }
.mi .label { flex: 1; font-size: 34px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi .hint { font-family: var(--f-pix); font-size: 10px; letter-spacing: .1em; opacity: .45; white-space: nowrap; }
.mi.on { background: var(--room); color: var(--room-ink); }
.mi.on svg { opacity: 1; }
.mi.on .hint { opacity: .9; }

/* background picker rows, after CleanFrame's wallpaper list */
.wallview { position: relative; height: 552px; overflow: hidden; }
.wallrows { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 8px; transition: transform .16s var(--ease); will-change: transform; }
.mi.wall { width: 640px; height: 84px; padding: 0 20px 0 12px; }
.thumb { flex: none; width: 104px; height: 58px; overflow: hidden; background: #1a1626; }
.thumb img, .thumb video { display: block; width: 100%; height: 100%; object-fit: cover; }
.mi.wall .label { font-size: 30px; }
.picked { font-family: var(--f-pix); font-size: 10px; letter-spacing: .1em; }

.side { transition: opacity .2s linear; }
.picking .side { opacity: 0; }
.picking .bg-shade { opacity: .55; }
.roomcard { position: absolute; right: 64px; bottom: 100px; width: 330px; padding: 18px 20px 20px; background: var(--panel);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.roomcard .top { display: flex; justify-content: space-between; font-family: var(--f-pix); font-size: 10px; letter-spacing: .14em; color: var(--accent); }
.roomcard .name { margin: 12px 0 6px; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: .06em; text-transform: uppercase; color: var(--room); }
.roomcard .spec { font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #d6d0e3; }

section.peek { position: absolute; right: 64px; top: 180px; width: 600px; padding: 42px; background: var(--panel); border: 1px solid rgba(244,241,251,.16); }
.peek .tag { font-family: var(--f-pix); font-size: 12px; letter-spacing: .16em; color: var(--room); }
.peek h1 { margin: 20px 0 16px; font-size: 76px; line-height: .95; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.peek p { margin: 0; font-size: 24px; line-height: 1.45; color: #d6d0e3; max-width: 30ch; }
.peek dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; margin: 28px 0 0; font-size: 20px; }
.peek dt { font-family: var(--f-pix); font-size: 11px; letter-spacing: .14em; color: var(--mute); align-self: center; }
.peek dd { margin: 0; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.peek .go { display: flex; align-items: center; gap: 12px; margin-top: 34px; padding-top: 22px; border-top: 1px solid rgba(244,241,251,.16);
  font-family: var(--f-pix); font-size: 13px; letter-spacing: .14em; color: var(--accent); }
.peek .go .bar { flex: 1; height: 10px; opacity: .5; background: repeating-linear-gradient(90deg, var(--accent) 0 12px, transparent 12px 18px); }
.swap { animation: swap .2s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

footer { position: absolute; left: 72px; right: 64px; bottom: 36px; display: flex; justify-content: space-between;
  font-family: var(--f-pix); font-size: 12px; letter-spacing: .12em; color: var(--mute); }
footer .keys { display: flex; gap: 30px; }

/* ---------- "low card" layout for scenes whose logo fills the upper right / centre ---------- */
.card-low .roomcard { display: none; }
.card-low section.peek { top: auto; bottom: 92px; width: 560px; padding: 30px 34px; }
.card-low .peek h1 { margin: 14px 0 10px; font-size: 54px; }
.card-low .peek p { font-size: 20px; }
.card-low .peek dl { margin-top: 16px; font-size: 18px; }
.card-low .peek .go { margin-top: 18px; padding-top: 14px; }
.card-low #items .mi { width: 460px; }
.card-low .bg-shade { background:
    linear-gradient(90deg, rgba(6,5,10,.86) 0%, rgba(6,5,10,.38) 24%, rgba(6,5,10,0) 38%),
    linear-gradient(0deg, rgba(6,5,10,.7) 0%, rgba(6,5,10,0) 34%); }

/* ---------- app / input grid ---------- */
#apps { position: absolute; inset: 0; background: rgba(4,3,8,.95); padding: 120px 140px; overflow: hidden; }
.gridview { position: absolute; left: 140px; right: 140px; top: 200px; bottom: 90px; overflow: hidden; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; transition: transform .16s var(--ease); will-change: transform; }
.more { position: absolute; left: 140px; right: 140px; bottom: 40px; text-align: center; font-family: var(--f-pix); font-size: 12px; letter-spacing: .14em; color: var(--mute); }
.tile { position: relative; height: 170px; padding: 22px; border: 2px solid rgba(244,241,251,.14); background: rgba(16,13,26,.9);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%); }
.tile .mono { font-family: var(--f-pix); font-size: 26px; color: var(--room); }
.tile .nm { font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tile .sub { position: absolute; right: 22px; top: 24px; font-family: var(--f-pix); font-size: 11px; letter-spacing: .12em; opacity: .7; }
.tile.on { background: var(--room); color: var(--room-ink); border-color: var(--room); }
.tile.on .mono { color: var(--room-ink); }

/* ---------- launch transition: dive into the scene, then the screen closes to a line ---------- */
#crt { pointer-events: none; }
/* lightning: a violet-white flash like the strike in the scene loops */
#flash { pointer-events: none; opacity: 0; background: radial-gradient(70% 90% at var(--fx, 50%) var(--fy, 40%), #fff 0%, #d9c8ff 30%, rgba(160,120,255,.5) 60%, rgba(60,40,140,0) 100%); }
.leaving #flash { animation: strike .26s linear both; }
@keyframes strike { 0% { opacity: 0 } 10% { opacity: .75 } 22% { opacity: .15 } 34% { opacity: .55 } 100% { opacity: 0 } }
/* coming back: the menu buzzes on like a neon tube */
.neon-on #ui { animation: neonOn .42s linear both; }
@keyframes neonOn { 0% { opacity: 0 } 12% { opacity: .9 } 20% { opacity: .2 } 32% { opacity: 1 } 40% { opacity: .5 } 52% { opacity: 1 } 100% { opacity: 1 } }
#crt .t, #crt .b { position: absolute; left: 0; right: 0; height: 50%; background: #000; transform: scaleY(0); transition: transform .16s cubic-bezier(.7, 0, 1, .6); }
#crt .t { top: 0; transform-origin: 50% 0; }
#crt .b { bottom: 0; transform-origin: 50% 100%; }
#crt .line { position: absolute; left: 0; right: 0; top: 539px; height: 2px; background: #fff;
  box-shadow: 0 0 18px 4px var(--room), 0 0 60px 12px var(--room); opacity: 0; transform: scaleX(1); transition: opacity .08s linear, transform .14s ease-in; }
.leaving #world { transform: scale(1.6); }
.leaving #ui { opacity: 0; transform: scale(1.08); }
.leaving #crt .t, .leaving #crt .b { transform: scaleY(1); transition-delay: .16s; }
.leaving #crt .line { opacity: 1; transform: scaleX(0); transition-delay: .26s, .3s; }
.snap #world, .snap #ui, .snap #crt .t, .snap #crt .b, .snap #crt .line { transition: none !important; }
.leaving #world { transition-delay: .06s; }

#toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); padding: 18px 28px; background: var(--ink); color: var(--room-ink);
  font-size: 22px; font-weight: 600; letter-spacing: .04em; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }

#preview { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: #0d0a16; border-top: 1px solid rgba(244,241,251,.12); font: 13px/1.3 var(--f-ui); color: var(--mute); }
#preview .k { font-family: var(--f-pix); font-size: 9px; letter-spacing: .12em; color: var(--accent); }
#preview button { font: 600 13px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid rgba(244,241,251,.25); padding: 6px 10px; cursor: pointer; }
#preview button[aria-pressed="true"] { background: var(--room); color: var(--room-ink); border-color: var(--room); }
#preview .tip { margin-left: auto; }

@media (prefers-reduced-motion: reduce) {
  #world, #ui, .panel, .wallrows, .grid, .mi, #bgA, #bgB, #crt .t, #crt .b, #crt .line { transition: none !important; }
  .swap, .leaving #flash, .neon-on #ui { animation: none !important; }
}
</style>

<div id="stage" role="application" aria-label="Round2 TV home screen">
  <div id="world" class="layer">
    <div class="layer bg-glow"></div>
    <div class="layer" id="bgA"></div>
    <div class="layer" id="bgB"></div>
    <div class="layer bg-shade"></div>
    <div class="layer scan" aria-hidden="true"></div>
  </div>

  <div id="ui" class="layer">
    <header>
      <div id="brand"><span class="wordmark">ROUND2</span></div>
      <div class="hud">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="badge">P1 <b id="roomBadge">VALE</b> <span id="tierBadge">NETFLIX ROOM</span></span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <nav class="panel" id="menuPanel" aria-label="Main menu">
      <div class="eyebrow">MAIN MENU</div>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <div class="list" id="items"></div>
    </nav>

    <nav class="panel off" id="setPanel" aria-label="Options">
      <div class="eyebrow"><span id="setTitle">OPTIONS</span><span class="count" id="setCount"></span></div>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <div class="list" id="setList"></div>
      <div class="wallview" id="wallView" hidden><div class="wallrows" id="wallRows"></div></div>
    </nav>

    <div class="side">
      <div class="roomcard" aria-label="This room">
        <div class="top"><span>&#9733; THIS ROOM</span><span id="paxBadge">1–3 PAX</span></div>
        <div class="name" id="roomName">Vale</div>
        <div class="spec" id="roomSpec">65" TV · PS4</div>
      </div>
      <section class="peek" aria-live="polite" id="peek"></section>
    </div>

    <footer>
      <div class="keys" id="keys"><span>[OK] SELECT</span><span>[&#9650;&#9660;] MOVE</span><span>[HOME] BACK TO THIS MENU</span></div>
      <div>20 HAJI LANE · SINGAPORE</div>
    </footer>

    <div id="apps" hidden>
      <div class="eyebrow" id="gridTitle">MORE APPS · [BACK] TO RETURN</div>
      <div class="gridview"><div class="grid" id="grid"></div></div>
      <div class="more" id="gridMore" hidden>&#9660; MORE BELOW</div>
    </div>
  </div>

  <div id="flash" class="layer" aria-hidden="true"></div>
  <div id="crt" class="layer" aria-hidden="true"><div class="t"></div><div class="b"></div><div class="line"></div></div>
  <div id="toast" role="status" hidden></div>
</div>

<div id="preview" hidden>
  <span class="k">PREVIEW ROOM</span>
  <span id="roomBtns"></span>
  <span class="tip">Use the arrow keys and Enter, like the TV remote</span>
</div>

    st.transform = 'scale(' + s + ')';
  }

  /* Logo from Wix (loads on the TV; a blocked load keeps the text fallback) */
  var logo = new Image();
  logo.onload = function () { logo.className = 'logo'; logo.alt = 'Round2'; $('brand').innerHTML = ''; $('brand').appendChild(logo); };
  logo.src = ASSETS.logo;

  /* skip bundled scenes that aren't in this build */
  (function () {
    for (var rk in SCENES) if (SCENES.hasOwnProperty(rk)) for (var i = 0; i < SCENES[rk].length; i++) (function (sc, rkey) {
      var probe = new Image();
      probe.onerror = function () {
        missing[sc.id] = true;
        if (rkey === roomKey && shownWall && shownWall.id === sc.id) { shownWall = null; showWall(currentWall()); }
      };
      probe.src = sc.thumb;
    }(SCENES[rk][i], rk));
  }());

  if (Device.kind() === 'preview') {
    var html = '';
    for (var k in ROOMS) if (ROOMS.hasOwnProperty(k)) html += '<button type="button" data-r="' + k + '">' + ROOMS[k].name + '</button> ';
    $('roomBtns').innerHTML = html;
    $('roomBtns').addEventListener('click', function (ev) {
      var r = ev.target.getAttribute && ev.target.getAttribute('data-r');
      if (r) { closeGrid(); if (mode !== 'menu') closeSettings(); applyRoom(r); ev.target.blur(); }
    });
    $('preview').hidden = false;
    PREVIEW_BAR = $('preview').offsetHeight;
  }

  window.addEventListener('resize', function () { if (!$('preview').hidden) PREVIEW_BAR = $('preview').offsetHeight; fit(); });
  window.addEventListener('load', fit);
  applyRoom(roomKey);
  fit(); tick(); setInterval(tick, 15000);
  setTimeout(fit, 400); setTimeout(fit, 1500);
  if (needsRoom && Device.kind() !== 'preview') openGrid('rooms');
}());
</script>
