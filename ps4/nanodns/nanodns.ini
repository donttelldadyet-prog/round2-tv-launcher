# Round2 nanoDNS settings (for nanoDNS v0.4)
# Copy to the PS4 at: /data/nanodns/nanodns.ini
# Delete any old nanodns.ini there first.
#
# Rule: block EVERYTHING, then let through only the names in [exceptions].
# PS4 network settings: Primary DNS 127.0.0.1 AND Secondary DNS 127.0.0.1

[general]
log=/data/nanodns/nanodns.log
debug=0
# 0 = show nanoDNS's pop-up when it starts (useful while testing)
# change to 1 once every PS4 is live, so guests don't see it
quiet=0
bind=127.0.0.1
bind6=::1

[upstream]
# servers are tried in order
server=1.1.1.1
server=8.8.8.8
timeout_ms=1500

[overrides]
# block every name...
*=0.0.0.0

[exceptions]
# ...except these

# Round2 (game list, game saves, everything Round2 builds)
round2.sg
*.round2.sg
# Round2's booking engine (Cloudflare) – the PS4 app talks to it
round2-book.donttelldadyet.workers.dev

# Time: GoldHEN's Date/Time auto update source is time1.google.com
# (time*.google.com also covers time2-4 if the source is ever changed)
time.google.com
time*.google.com
