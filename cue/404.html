html, body { margin: 0; height: 100%; background: #0b0914; }
iframe { border: 0; display: block; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<script>
/* cue.round2.sg — the short, branded address for guest message links.
   cue.round2.sg/K7Q2MX9A (also ?K7Q2MX9A, ?c=K7Q2MX9A or #K7Q2MX9A) shows the guest page from
   round2-tv-launcher/manager/msg/ inside this page, so the address stays cue.round2.sg and the page itself
   only lives in one place. GitHub Pages serves 404.html (a copy of this file) for /K7Q2MX9A. */
(function () {
  var raw = location.pathname.replace(/^\/+|\/+$/g, '') || location.search.replace(/^\?(c=)?/, '') || location.hash.slice(1);
  var code = raw.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 12);
  if (!code) { location.replace('https://www.round2.sg/'); return; }
  var f = document.createElement('iframe');
  f.title = 'Round2 message'; f.allow = 'clipboard-write';
  f.src = 'https://donttelldadyet-prog.github.io/round2-tv-launcher/msg/?c=' + encodeURIComponent(code);
  document.body.appendChild(f);
}());
</script>
</body>
