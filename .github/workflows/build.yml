name: Build Round2 Home

on:
  push:
    branches: [main]
    paths-ignore: ['themes/**', 'manager/**', 'README.md']   # webos/ changes do rebuild   # event backgrounds are published by themes.yml, no app rebuild needed
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to republish the Theme manager site with the new LG listing

# one build at a time; a newer push cancels an older build that hasn't finished
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install video tools
        timeout-minutes: 6
        run: |
          command -v ffmpeg && exit 0
          for n in 1 2; do
            timeout 90 bash -c 'sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg' && exit 0
            echo "apt attempt $n failed, retrying"
          done
          echo "apt unavailable: using the static ffmpeg build from GitHub (BtbN/FFmpeg-Builds)"
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"
      - name: Prepare the menu page and scene videos
        env:
          FOOD_ALERT_KEY: ${{ secrets.FOOD_ALERT_KEY }}
        run: bash tools/build-web.sh
      - name: Build the app
        env:
          FOOD_ALERT_KEY: ${{ secrets.FOOD_ALERT_KEY }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk round2-home.apk
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package the LG (webOS) version
        run: |
          npm install -g @webos-tools/cli
          ARES_PACKAGE=ares-package bash tools/build-webos.sh 1.0.${{ github.run_number }}
          ARES_PACKAGE=ares-package bash tools/build-alerts.sh 1.0.${{ github.run_number }}
      # Builds of other branches (run by hand from the Actions tab) are test builds: published as a
      # pre-release, which the TVs' auto-update ignores. Install one with round2tv.ps1 on a single TV.
      - name: Publish a test pre-release
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.ref_name }}-${{ github.run_number }}
          name: TEST ${{ github.ref_name }} ${{ github.run_number }} (not for all TVs)
          body: Test build of ${{ github.ref_name }} at ${{ github.sha }}. TVs do not auto-update to this.
          files: |
            round2-home.apk
            round2-home.ipk
          prerelease: true
          make_latest: false
      - name: Publish a GitHub release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Round2 Home 1.0.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            TCL / Sony (Android): install with round2tv.ps1 launcher donttelldadyet-prog/round2-tv-launcher
            LG (webOS): install round2-home.ipk with webOS Dev Manager (see the README)
          files: |
            round2-home.apk
            round2-home.ipk
            sg.round2.alerts.*.ipk
          make_latest: true
      - name: List the new version for rooted LG TVs (Homebrew Channel)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/hbrepo.py 1.0.${{ github.run_number }} round2-home.ipk > manager/lg.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manager/lg.json
          git commit -q -m "LG Homebrew Channel listing: 1.0.${{ github.run_number }}" || exit 0
          for n in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          gh workflow run pages.yml --ref main
