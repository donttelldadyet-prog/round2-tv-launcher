name: Build Round2 Home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare the menu page
        run: bash tools/build-web.sh
      - name: Build the app
        run: gradle --no-daemon :app:assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk round2-home.apk
      - name: Publish a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Round2 Home 1.0.${{ github.run_number }}
          body: Built from ${{ github.sha }}. Install with round2tv.ps1 launcher donttelldadyet-prog/round2-tv-launcher
          files: round2-home.apk
          make_latest: true
