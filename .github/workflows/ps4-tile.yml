# Builds the Round2 PS4 tile package (fPKG RTWO00001) on GitHub's machines.
# Only builds; releasing to the PS4s (branch ps4-tile) is a separate, checked step.
name: PS4 tile package
on:
  push:
    branches: [tile-v2, ps4-helper]
    paths: ['ps4/tile/**', '.github/workflows/ps4-tile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 lld-18 >/dev/null
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          curl -fsSL -o /tmp/oo.tgz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p /opt/oo && tar -xzf /tmp/oo.tgz -C /opt/oo
          TC=$(dirname $(dirname $(dirname $(find /opt/oo -path '*bin/linux/create-fself' | head -1))))
          echo "toolchain at $TC"; ls $TC; ls $TC/bin/linux
          chmod +x $TC/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
      - name: OpenSSL 1.1 (PkgTool.Core is a self-contained .NET Core 3.1 app)
        run: |
          curl -fsSL -o /tmp/ossl.tgz https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar -xzf /tmp/ossl.tgz -C /tmp && cd /tmp/openssl-1.1.1w
          ./config shared --prefix=/opt/ossl11 --openssldir=/opt/ossl11 >/dev/null && make -j4 >/dev/null 2>&1 && make install_sw >/dev/null
          echo "LD_LIBRARY_PATH=/opt/ossl11/lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cd ps4/tile && make 2>&1 | tail -40
          ls -la *.pkg
          sha256sum *.pkg eboot.bin | tee build-sha256.txt
      - name: Put the package on branch ps4-tile-staging (checked before it goes to ps4-tile, which the PS4s update from)
        run: |
          cd ps4/tile; V=$(grep -m1 '^VERSION' Makefile | awk '{print $3}'); P=IV0000-RTWO00001_00-ROUND2MEMBERS000.pkg
          mkdir -p /tmp/st && cp $P /tmp/st/round2_tile.pkg && cp eboot.bin /tmp/st/
          printf '{"v":"%s","sha256":"%s","size":%s}' "$V" "$(sha256sum $P | cut -d' ' -f1)" "$(stat -c%s $P)" > /tmp/st/round2_tile.json
          echo "built from ${GITHUB_SHA}" > /tmp/st/SOURCE.txt; cat /tmp/st/round2_tile.json
          cd /tmp/st && git init -q -b ps4-tile-staging && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "tile $V staging build (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ps4-tile-staging
      - uses: actions/upload-artifact@v4
        with:
          name: round2-tile
          path: |
            ps4/tile/*.pkg
            ps4/tile/eboot.bin
            ps4/tile/build-sha256.txt
