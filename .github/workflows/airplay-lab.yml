name: AirPlay lab (LG webOS 5+)

# Builds the picture test for LG TVs without libAcbAPI (webOS 5+, e.g. Bella's 2020 NanoCell)
# and puts it on the "airplay-lab" release. Round2 Home > Options > Staff mode > AirPlay lab
# installs it through Homebrew Channel, runs it and shows the result.
on:
  push:
    branches: [main]
    paths: ['airplay-webos/**', '.github/workflows/airplay-lab.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airplay-lab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core ninja-build autoconf automake libtool pkg-config
      - name: Cache the webOS toolchain
        uses: actions/cache@v4
        with:
          path: airplay-webos/.work/arm-webos-linux-gnueabi_sdk-buildroot
          key: webos-ndk-2026.08-webos
      - name: Build the picture test
        run: sh airplay-webos/build-lab.sh
      - name: Cache the receiver's pinned sources and built libraries
        uses: actions/cache@v4
        with:
          path: |
            airplay-webos/receiver/.cache/*.tar.*
            airplay-webos/receiver/.cache/deps
          key: receiver-deps-${{ hashFiles('airplay-webos/receiver/dependencies.lock.json', 'airplay-webos/receiver/tools/build-deps.sh') }}
      - name: Build the AirPlay receiver
        run: sh airplay-webos/build-receiver.sh "$PWD/airplay-webos/.work/arm-webos-linux-gnueabi_sdk-buildroot"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view airplay-lab >/dev/null 2>&1 || gh release create airplay-lab --title "AirPlay lab" \
            --notes "Test builds for AirPlay on LG webOS 5+ TVs. Installed from Round2 Home > Options > Staff mode > AirPlay lab." \
            --prerelease --latest=false
          gh release upload airplay-lab airplay-webos/dist/*.ipk airplay-webos/receiver/dist/*.ipk --clobber
          keep=$(ls airplay-webos/dist/*.ipk airplay-webos/receiver/dist/*.ipk | xargs -n1 basename | tr "\n" " ")
          for a in $(gh release view airplay-lab --json assets -q '.assets[].name'); do
            case " $keep " in *" $a "*) ;; *) gh release delete-asset airplay-lab "$a" -y ;; esac
          done
