name: Publish themes

# Edit themes/themes.json (or add a video to the themes folder) and commit:
# this encodes the videos and puts them on the "themes" release, where every TV picks them up.
on:
  push:
    branches: [main]
    paths: ['themes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: themes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        timeout-minutes: 6
        run: |
          command -v ffmpeg && exit 0
          for n in 1 2; do
            timeout 90 bash -c 'sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg' && exit 0
            echo "apt attempt $n failed, retrying"
          done
          echo "apt unavailable: using the static ffmpeg build from GitHub (BtbN/FFmpeg-Builds)"
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"
      - name: Make sure the themes release exists
        run: |
          gh release view themes >/dev/null 2>&1 || gh release create themes --title "Event backgrounds" \
            --notes "Event backgrounds for the Round2 TVs. Managed by the Publish themes action; edit themes/themes.json instead of this release." \
            --prerelease --latest=false
          mkdir -p out
          gh release download themes --pattern themes.json --output out/previous.json || echo '{"themes":[]}' > out/previous.json
      - name: Encode new or changed themes
        run: python3 tools/publish-themes.py
      - name: Upload to the themes release
        run: |
          cd out
          files=$(ls *.mp4 *.jpg *.ogg 2>/dev/null || true)
          [ -n "$files" ] && gh release upload themes $files --clobber
          gh release upload themes themes.json --clobber
          # remove videos of themes that were deleted from themes.json
          wanted=$(python3 -c "import json;j=json.load(open('themes.json'));print(' '.join([x for t in j['themes'] for x in (t['id']+'.mp4',t['id']+'.jpg')]+[x['id']+'.ogg' for x in j.get('sounds',[])]))")
          for a in $(gh release view themes --json assets -q '.assets[].name'); do
            case " $wanted themes.json " in *" $a "*) ;; *) gh release delete-asset themes "$a" -y ;; esac
          done
