name: Theme manager website

# Publishes the manager/ folder (the Round2 theme manager) on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['manager/**', 'web/index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# queue, never cut short (5 Nov): cancelling a run mid-upload left GitHub "still deploying" and refused the next ones
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the TV page's code, as plain text, for System check › watchdog (one clock + 7am rule)
      - run: mkdir -p manager/src && cp web/index.html manager/src/tv-web.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manager
      - id: deployment
        uses: actions/deploy-pages@v4
